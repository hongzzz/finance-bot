name: News Digest

on:
  schedule:
    # Beijing 10:00 and 17:00 (UTC+8). GitHub may start scheduled runs a few minutes late;
    # the script uses fixed window boundaries, so a late start does not drop or duplicate news.
    - cron: '0 2 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print the digest, do not send'
        type: boolean
        default: false

concurrency:
  group: news-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CODEX_HOME: ${{ runner.temp }}/finance-codex
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Codex
        run: npm install -g @openai/codex

      - name: Restore Codex subscription login
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          umask 077
          mkdir -p "$CODEX_HOME"
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const raw = process.env.CODEX_AUTH_JSON;
          if (!raw) throw new Error('Set CODEX_AUTH_JSON in Actions secrets');
          const auth = JSON.parse(raw);
          if (!auth.tokens?.access_token || !auth.tokens?.refresh_token) {
            throw new Error('Expected a ChatGPT subscription auth.json with OAuth tokens');
          }
          writeFileSync(`${process.env.CODEX_HOME}/auth.json`, raw, { mode: 0o600 });
          JS
          codex login status

      - name: Build and send digest
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          DIGEST_MODEL: ${{ vars.DIGEST_MODEL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/digest.mjs

      - name: Remove temporary Codex credentials
        if: always()
        run: rm -rf -- "$CODEX_HOME"
